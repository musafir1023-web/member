<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Aceh-inspired ornamental pattern - transparent background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1.2" fill="none">
    <!-- Central diamond -->
    <path d="M100 20 L180 100 L100 180 L20 100 Z"/>
    <!-- Inner diamond -->
    <path d="M100 40 L160 100 L100 160 L40 100 Z"/>
    <!-- Star pattern -->
    <path d="M100 15 L105 35 L120 20 L112 38 L135 30 L118 42 L140 45 L118 48 L135 60 L112 52 L120 70 L105 55 L100 75 L95 55 L80 70 L88 52 L65 60 L82 48 L60 45 L82 42 L65 30 L88 38 L80 20 L95 35 Z"/>
    <!-- Corner flourishes -->
    <path d="M20 20 Q40 20 50 40 Q40 35 20 40 Z"/>
    <path d="M180 20 Q160 20 150 40 Q160 35 180 40 Z"/>
    <path d="M20 180 Q40 180 50 160 Q40 165 20 160 Z"/>
    <path d="M180 180 Q160 180 150 160 Q160 165 180 160 Z"/>
    <!-- Decorative circles -->
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="100" r="45"/>
    <!-- Meander pattern edges -->
    <path d="M60 20 L70 30 L60 40 L70 50 L60 60"/>
    <path d="M140 20 L130 30 L140 40 L130 50 L140 60"/>
    <path d="M60 180 L70 170 L60 160 L70 150 L60 140"/>
    <path d="M140 180 L130 170 L140 160 L130 150 L140 140"/>
    <!-- Additional Aceh motifs -->
    <path d="M100 85 L115 100 L100 115 L85 100 Z" stroke-width="0.8"/>
    <path d="M80 60 Q100 45 120 60"/>
    <path d="M80 140 Q100 155 120 140"/>
  </g>
</svg>